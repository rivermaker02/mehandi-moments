name: Sync Google reviews to sheet

on:
  schedule:
    - cron: "17 0 * * *" # daily, 05:47 IST
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Scroll through ALL reviews (backfill)"
        type: boolean
        default: false
      dry_run:
        description: "Don't write to the sheet, just log"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: 1SkiLKY0d1vIMQsjlVAS0l9hCxDbJiYQyK9Iz5vbaNIc
          SHEET_NAME: Sheet1
          FULL_SCAN: ${{ inputs.full_scan && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/sync_reviews.py